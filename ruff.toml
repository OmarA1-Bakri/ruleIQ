# Ruff configuration for ruleIQ
target-version = "py311"
line-length = 100

[lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "ANN", # Type annotations
    "ARG", # Unused arguments
    "PLR", # Pylint refactor
    "S",   # Security - CRITICAL for security compliance
    "PT",  # pytest-specific rules
    "B",   # Bugbear - catches common bugs
    "SIM", # simplify - suggests simpler code
]

# Security-focused configuration with minimal ignores
ignore = [
    # Type annotations — deferred (mass-adding annotations is a separate task)
    "ANN001", # Missing type annotation for function argument
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for __init__
    "ANN205", # Missing return type annotation for static method
    "ANN206", # Missing return type annotation for class method
    "ANN401", # Any type allowed in validation utilities

    # Unused arguments — common in framework callbacks
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "ARG003", # Unused class method argument
    "ARG004", # Unused static method argument

    # Pylint refactor — style preferences
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value comparison — style only

    # Style — not blocking production
    "E402",  # Module import not at top — many conditional imports in codebase
    "E501",  # Line too long — style only, no functional impact
    "E722",  # Bare except — deferred (13 instances, need careful review)
    "E741",  # Ambiguous variable name — style only
    "SIM102", # Collapsible if — style only
    "SIM103", # Needless bool — style only
    "SIM105", # Suppressible exception (contextlib.suppress) — style only
    "SIM108", # If-else block instead of ternary — style only
    "SIM113", # Enumerate for loop — style only
    "SIM115", # Open file with context handler — many legitimate uses
    "SIM116", # If-else block instead of dict lookup — style only
    "SIM117", # Multiple with statements — style only

    # Bugbear
    "B007",  # Unused loop control variable — style (use _ prefix instead)
    "B008",  # Function call in default argument — required for FastAPI Depends() pattern
    "B012",  # Jump statement in finally — single instance, deferred
    "B017",  # Assert raises exception — common test pattern
    "B018",  # Useless expression — single instance, deferred
    "B019",  # Cached instance method — deferred
    "B025",  # Duplicate try-block exception — test patterns
    "B026",  # Star-arg unpacking after keyword arg — test patterns
    "B039",  # Mutable contextvar default — single instance, deferred
    "B904",  # Exception chaining — too many to fix at once, deferred
    "B905",  # zip-without-explicit-strict — new py311 rule, deferred

    # Security — rules that produce noise in non-production code
    "S101",  # Assert (used in test files and assertions)
    "S104",  # Hardcoded bind all interfaces — expected in server code (0.0.0.0)
    "S108",  # Hardcoded temp file — noise in utility code
    "S110",  # Try-except-pass — deferred (47 instances, need careful review)
    "S113",  # Request without timeout — deferred (need to add timeouts carefully)
    "S311",  # Non-cryptographic random usage
    "S324",  # Hashlib insecure hash — many are non-security uses (content hashing, etags)
    "S602",  # Subprocess with shell=True — reviewed case-by-case, not auto-fixable
    "S603",  # Subprocess without shell (acceptable with validation)
    "S605",  # Start process with shell — reviewed case-by-case
    "S607",  # Start process with partial path — common in deploy/utility scripts

    # Pyflakes
    "F631",  # Assert on non-empty tuple — mostly in test patterns
    "F821",  # Undefined name — many stub files with incomplete imports, deferred

    # pytest
    "PT011", # pytest-raises-too-broad — test pattern, not blocking
    "PT012", # pytest-raises with multiple statements — test pattern
    "PT028", # pytest parameter with default argument — test pattern

    # Hardcoded password detection — S105/S106/S107 produce false positives on variable names
    # containing "password", "secret", "token" (e.g. token_type="bearer", secret_key=setting_value).
    # Real hardcoded credentials were remediated (see SPRINT_HANDOVER.md). detect-secrets
    # pre-commit hook provides actual secret scanning. Suppress these in ruff.
    "S105",  # Possible hardcoded password assigned to variable
    "S106",  # Possible hardcoded password assigned to argument
    "S107",  # Possible hardcoded password assigned to function default

    # Remaining single-instance or low-count rules — deferred
    "S314",  # Suspicious XML element tree usage — single instance
    "S608",  # Hardcoded SQL expression — single instance, reviewed
    "F501",  # Percent format invalid — deferred (5 instances in legacy code)
    "F402",  # Import shadowed by loop var — deferred (3 instances)
    "F403",  # Undefined local with import star — deferred (3 instances)
    "F405",  # Undefined local with import star usage — deferred
    "F507",  # Percent format positional count mismatch — deferred
    "F509",  # Percent format unsupported format character — deferred
    "F823",  # Undefined local — deferred (1 instance)
    "W292",  # Missing newline at end of file — auto-fixable but harmless

    # NOTE: B301 (pickle usage) REMAINS ENABLED
]

# Directories to exclude
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".env",
    "build",
    "dist",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "migrations",
    "validate-auth-flow.py",
    # Non-production code — utility scripts, deployment helpers, visualization prototype
    ".claude/",
    "visualization-backend/",
    "deployment/",
    "scripts/",
]

[lint.per-file-ignores]
# Test files have different requirements
"tests/*" = [
    "SIM117", "B011",  # Existing ignores
    "ANN",     # Type annotations not required in tests
    "ARG",     # Unused arguments (common in pytest fixtures)
    "PLR0913", # Too many arguments (common in test methods)
    "PLR0915", # Too many statements (common in test methods)
    "PLR2004", # Magic value used in comparison (common in tests)
    "S101",    # Use of assert (required in tests)
    "PT",      # pytest-specific rules
    "E501",    # Line too long (common in test data)
    "W291",    # Trailing whitespace
    "F401",    # Unused imports (common in test fixtures)
    "F811",    # Redefined while unused (common in test overrides)
    "F841",    # Unused variables (common in test setup)
    "E402",    # Module import not at top of file (common in tests)
    "F821",    # Undefined name (fixtures)
    "S113",    # Request without timeout (acceptable in tests)
    "S105", "S106", "S107",  # Hardcoded test credentials acceptable in tests
    "B023",    # Function uses loop variable — common in test generators
    "B025",    # Duplicate try-block exception — test patterns
    "B026",    # Star-arg unpacking after keyword arg — test patterns
]
"tests/**/*.py" = [
    "F631",    # Assert on non-empty tuple
    "F811",    # Redefined while unused
    "S105", "S106", "S107",  # Hardcoded test credentials
]
"*/__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"stubs/**/*.py" = ["F821"]

# Non-security services — allow hardcoded password strings for config defaults
"services/ai/*.py" = ["S105", "S106", "S107"]
"services/neo4j_service.py" = ["S105", "S106", "S107"]
"langgraph_agent/**/*.py" = ["S105", "S106", "S107"]
"config/*.py" = ["S105", "S106", "S107"]
"middleware/*.py" = ["S105", "S106", "S107"]
"main.py" = ["S105", "S106", "S107"]
"production_start.py" = ["S105", "S106", "S107"]

# Security-critical files need stricter rules
"api/routers/*.py" = []  # No security ignores for API endpoints
"api/dependencies/*.py" = []  # No security ignores for dependencies
"services/auth*.py" = []  # No security ignores for auth services
"services/security*.py" = []  # No security ignores for security services
"api/utils/security*.py" = ["ANN401"]  # Allow Any type in security validators

# Caching-specific security rules
"services/caching/*.py" = []  # No security ignores for caching services - they handle sensitive data

[lint.isort]
known-first-party = ["api", "database", "services", "config", "core"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
